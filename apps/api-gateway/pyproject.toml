[project]
name = "api-gateway"
version = "3.1.4"
description = "RebornStudio API Gateway"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    # fastapi가 하한만 두는 전이 의존이다. 알려진 취약 버전으로 잠기지 않게 하한을 직접 적는다.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "reborn-contracts",
    "reborn-transcode",
    "bcrypt>=4.2",
    "cryptography>=42",   # 연결 자격증명의 Fernet 대칭 암호화(services/crypto.py)
    # 2.15.0 미만은 깊게 중첩한 헤더를 받으면 RecursionError로 500을 낸다.
    "pyjwt>=2.15.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "redis>=5.0",
    # 납품 패키지 색인 체크섬. 납품 규격이 `xxh64`를 정한다. `reborn-transcode`의 전이 의존에
    # 기대면 패키지가 없을 때 `blake2b`로 조용히 바뀌므로 쓰는 쪽이 직접 적는다.
    "xxhash>=3.5",
    # `dataset_card.yaml`을 직렬화기로 만든다. f-문자열로 붙이면 프로젝트 이름의 `:`가
    # YAML을 깨뜨린다. 런타임에서 쓰므로 테스트 그룹이 아니라 런타임 의존으로 둔다.
    "pyyaml>=6.0",
    # 영상 메타 일괄 입력의 양식(.xlsx)을 만들고 올린 파일을 읽는다. MIT 라이선스다.
    "openpyxl>=3.1",
    # FastAPI의 파일 업로드(`UploadFile`)가 multipart 본문을 읽는 데 쓴다. Apache-2.0 라이선스다.
    "python-multipart>=0.0.20",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "import-linter>=2.13",
    "moto[server]>=5.2.2",
    # 내보내는 레코드를 패키지의 JSON Schema로 검증한다(`test_export_omit_optional.py`).
    # moto가 함께 설치하지만 전이 의존에 기대면 moto가 의존을 바꿀 때 테스트가 깨지므로 직접 적는다.
    "jsonschema>=4.20",
    # `dataset_card.yaml`이 YAML로 읽히는지 테스트가 확인한다. 이 의존도 전이 의존에 기대지 않고 직접 적는다.
    "pyyaml>=6.0",
    # pytest 병렬 실행. 워커별 DB·Redis는 `tests/_xdist_split.py`가 나눈다.
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "live: 실제 외부 API 호출이 발생하는 통합 테스트. MAIU_LIVE_TEST=1일 때만 실행",
    "real_probe: 연결 점검의 외부 접속 대역(conftest)을 끄고 실제 점검 분기를 부르는 테스트",
]

# ── 도메인 경계 계약 ─────────────
# 도메인 경계를 CI의 lint-imports로 검사해 위반을 빌드 실패로 만든다.
# 실행: uv run --package api-gateway --group test lint-imports  (이 디렉터리에서)
[tool.importlinter]
root_packages = ["api_gateway"]

# 레이어 계약. 의존은 `api` → `services` → `models` 한 방향만 허용한다.
# 역방향 의존이 생기면 서비스만 import하는 워커가 api 계층까지 끌어오게 된다.
[[tool.importlinter.contracts]]
name = "레이어 방향 — api → services → models"
type = "layers"
layers = ["api_gateway.api", "api_gateway.services", "api_gateway.models"]

# 쓰기와 판정은 소유 도메인만 한다는 규칙의 정적 근사다. 도메인 패키지 간 import는 아래 허용 목록이 전부다.
# 목록의 줄은 파이프라인 순방향 호출, 소유 도메인의 공개 함수, 읽기 전용 조회 중 하나이고 줄마다 이유를 적는다.
# 줄 수는 주석에 적지 않는다. 세려면 이 디렉터리에서 `grep -c '^    "api_gateway[^"]* -> ' pyproject.toml`을 돌린다.
# 새 교차 의존이 필요하면: (1) 소유 도메인의 공개 함수인지 확인하고 (2) 여기 한 줄과
# services/README.md 소유권 표를 같은 커밋에서 갱신한다. 허용 목록이 검토 없이 늘지 않게 한다.
# 평면 모듈(services/*.py)은 이 계약 밖이다. 그중 커널 모듈은 아래 커널 계약이 따로 막는다.
# 도메인 패키지를 새로 만들면 이 목록과 커널 계약의 forbidden_modules에 같이 넣는다.
# tests/contract/test_import_contracts.py가 두 목록이 services/ 아래 패키지 전부와 같은지 본다.
[[tool.importlinter.contracts]]
name = "도메인 독립 — 허용 목록 밖 교차 import 금지"
type = "independence"
modules = [
    "api_gateway.services.analysis",
    "api_gateway.services.analytics",
    "api_gateway.services.auth",
    "api_gateway.services.caption_qc",
    "api_gateway.services.exports",
    "api_gateway.services.maiu",
    "api_gateway.services.media",
    "api_gateway.services.ops",
    "api_gateway.services.org",
    "api_gateway.services.stacks",
    "api_gateway.services.work",
    "api_gateway.services.workforce",
]
ignore_imports = [
    # 리포팅은 모든 도메인을 읽는다. 납품 불가 사유 분포를 납품 패키지와 같은 판정으로 세려고
    # `exports`를 읽는다. 읽기 전용이다.
    "api_gateway.services.analytics.dashboard.capacity -> api_gateway.services.exports.export_service",
    "api_gateway.services.analytics.dashboard.capacity -> api_gateway.services.exports.export_package",
    # 단계 배지가 반입 화면과 같은 분류를 쓰도록 `_ingest_bucket_case`를 가져온다.
    # 조건을 따로 쓰면 우선순위(분석 실패가 요청 대기보다 먼저)가 빠져 같은 화면의 배지와 칩의 수가 달라진다.
    # 읽기 전용이다. 반대 방향(`media`에서 `analytics`로)의 import는 금지다.
    "api_gateway.services.analytics.dashboard.queries -> api_gateway.services.media.video",
    # 파이프라인 요약의 `라벨링 대기`를 큐 카드의 `대기 N`과 같은 조건(`_claimable_where`)으로 센다.
    # 조건이 두 곳에 있으면 스텝퍼 배지와 패널의 수가 달라진다.
    # 읽기 전용이고 판정은 work가 갖는다.
    "api_gateway.services.analytics.dashboard.queries -> api_gateway.services.work.service",
    # 진척의 시간 분모가 제외된 클립을 빼는 기준(`EXCLUDED_RIGHTS`)을 콘텐츠 목록의 진척
    # 요약과 같은 상수로 읽는다. 두 곳이 값을 각자 적으면 분모가 달라진다. 읽기 전용이다.
    "api_gateway.services.analytics.stats -> api_gateway.services.media.progress",
    # 분석 자원 진단이 연동 진단과 같은 `Check` 모양을 쓴다. 모양이 둘이면 같은 사실이
    # 두 화면에서 다르게 표시된다. 읽기 전용이다.
    "api_gateway.services.maiu.provisioning -> api_gateway.services.ops.diagnostics",
    # 캡션 품질검수 러너는 검사 재료를 모으므로 여러 도메인을 읽는다.
    # 재료를 호출하는 쪽(`work`)이 모으면 같은 의존이 `work`에 직접 생기고, 주기 재검사나
    # 운영자 수동 실행에서 검사기를 부를 때 수집 코드를 다시 써야 한다.
    # 읽기 전용이고 판정은 `caption_qc.rules` 한 곳이 한다.
    "api_gateway.services.caption_qc.runner -> api_gateway.services.analysis.scene_options",
    # 주의: 없는 import를 이 목록에 남겨 두면 import-linter가 `No matches for ignored import`로
    # 실패해 게이트가 깨진다. import를 지울 때 이 목록의 줄도 같은 커밋에서 지운다.
    # 파이프라인 순방향: 분석·반입이 라벨링 티켓을 연다
    # reconciler는 패키지라 가져오는 하위 모듈마다 한 줄씩 적는다(가져오는 쪽 이름이 모듈 단위다).
    "api_gateway.services.maiu.reconciler.stages -> api_gateway.services.work.service",
    "api_gateway.services.maiu.reconciler.ingest -> api_gateway.services.work.service",
    # 분석 재시도가 등록부터 다시 실행할 때 디스패치 티켓을 되살린다.
    # 조건 판정은 `work.service.ensure_for_video` 한 곳이 한다. 복구 경로가 다른 규칙을 쓰면
    # 정상 경로와 결과가 달라진다.
    "api_gateway.services.maiu.service -> api_gateway.services.work.service",
    # 영상 패키지는 하위 모듈마다 따로 적는다. 가져오는 쪽이 하위 모듈이라 한 줄로 묶이지 않는다.
    "api_gateway.services.media.video.commands -> api_gateway.services.work.service",
    "api_gateway.services.media.video.queries -> api_gateway.services.work.service",
    "api_gateway.services.media.video.upload -> api_gateway.services.work.service",
    # 장면 분할이 만든 클립에 라벨링 작업을 연다. 분석(MI) 회수가 클립을 만든 뒤 하는 일과 같다.
    "api_gateway.services.media.scene_split -> api_gateway.services.work.service",
    # 사람이 넣은 클립에도 같은 함수로 라벨링 작업을 연다.
    "api_gateway.services.media.clip -> api_gateway.services.work.service",
    # catalog 공개 인터페이스(storage presign·클립 조회·DTO)
    "api_gateway.services.maiu.service -> api_gateway.services.media.storage",
    # 분석 입력은 매체 결정자(resolver) 한 곳에서 고른다. 단계를 끼워 넣어도 호출하는 쪽은 바뀌지 않는다.
    "api_gateway.services.maiu.service -> api_gateway.services.media.resolver",
    # 단계 이력(stage_runs)은 영상 준비 과정의 기록이라 media가 소유한다. maiu는 자기
    # 단계(등록·분석)의 시작·끝을 같은 표에 남긴다. 기록이 두 표로 나뉘면 단계별 p95를 낼 수 없다.
    "api_gateway.services.maiu.service -> api_gateway.services.media.stage_runs",
    "api_gateway.services.maiu.reconciler.stages -> api_gateway.services.media.stage_runs",
    "api_gateway.services.maiu.reconciler.errors -> api_gateway.services.media.stage_runs",
    "api_gateway.services.maiu.reconciler.stages -> api_gateway.services.media.resolver",
    # 분석 산출은 catalog 소유 함수로 쓴다(Clip 생성·미디어 메타 흡수).
    "api_gateway.services.maiu.reconciler.ingest -> api_gateway.services.media.clip",
    "api_gateway.services.maiu.reconciler.ingest -> api_gateway.services.media.video",
    # videos.metadata는 원자적 병합(merge_extra)으로 쓴다. 통째로 치환하면 다른
    # 워커가 쓴 키가 지워진다(lost update). 쓰기는 catalog 소유 함수로만 한다.
    "api_gateway.services.maiu.service -> api_gateway.services.media.video",
    # 분석 상태의 어휘를 세 도메인이 같이 쓴다(`analysis/job_state.py`).
    # 상수만 있는 모듈이라 역방향 의존도, 실행 결합도 없다. 각자 튜플을 적으면
    # 상태가 하나 늘 때 한 곳만 놓쳐도 그 화면만 다른 상태로 분류한다.
    "api_gateway.services.media.retention -> api_gateway.services.analysis.job_state",
    # 비식별화 신고 목록이 장면 대표 프레임 주소(`_thumbnail_url`)를 클립 화면과 같은 함수로 만든다.
    "api_gateway.services.work.deident_reports -> api_gateway.services.media.clip",
    "api_gateway.services.analytics.dashboard.queries -> api_gateway.services.analysis.job_state",
    # 화면에 MI 단계를 표시하려면 어느 행이 MI 행인지 알아야 한다. `analysis_job`은 어댑터와
    # 무관한 표라 한 영상에 MI 행과 씬 분할 행이 함께 있다. 필터가 없으면 씬 분할 행을
    # MI 단계로 표시한다. 등록부는 상수뿐이다.
    "api_gateway.services.media.video.classify -> api_gateway.services.analysis.registry",
    "api_gateway.services.media.video.timeline -> api_gateway.services.analysis.registry",
    # 준비 타임라인은 프로젝트 분석 방식에 있는 단계만 싣는다. 판정(`needs_analysis`)은 analysis가 갖는다.
    "api_gateway.services.media.video.timeline -> api_gateway.services.analysis.presets",
    # 분석 스택은 프로젝트를 만들 때 고정된다. 스택 목록은 analysis의 카탈로그(상수만 있는 모듈)에 있고,
    # org는 카탈로그를 읽어 프로젝트에 기록만 한다.
    "api_gateway.services.org.project -> api_gateway.services.analysis.presets",
    # 클립 길이 설정도 analysis에 둔다. 스택 카탈로그와 클립 길이 설정을 다른 도메인에 두면
    # 프로젝트의 클립 설정을 확인할 곳이 둘이 된다. 상수와 pydantic 모델뿐이다.
    "api_gateway.services.org.project -> api_gateway.services.analysis.scene_options",
    "api_gateway.services.maiu.service -> api_gateway.services.analysis.job_state",
    "api_gateway.services.maiu.service -> api_gateway.services.analysis.scene_options",
    "api_gateway.services.maiu.reconciler.stages -> api_gateway.services.analysis.scene_options",
    "api_gateway.services.maiu.service -> api_gateway.services.analysis.registry",
    # MI를 쓰지 않는 스택의 영상은 MI로 보내지 않는다. 판정 근거가 카탈로그다.
    # 자체 분할 스택의 영상을 MI에 보내면 한 프로젝트에 두 분석 방식의 클립이 섞이고,
    # 쓰지 않을 분석에 시간당 요금이 나간다. 카탈로그는 상수뿐이다.
    "api_gateway.services.maiu.service -> api_gateway.services.analysis.presets",
    "api_gateway.services.maiu.reconciler.stages -> api_gateway.services.analysis.registry",
    "api_gateway.services.maiu.reconciler.ingest -> api_gateway.services.analysis.registry",
    "api_gateway.services.maiu.reconciler.stages -> api_gateway.services.analysis.job_state",
    "api_gateway.services.maiu.reconciler.errors -> api_gateway.services.analysis.job_state",
    # 씬 분할의 DB 작업은 media에 있다. 씬 분할의 결과가 클립이고 클립은 media 자산이다.
    # 규칙은 analysis가 갖는다. 어느 프로젝트가 자체 분할을 쓰는지(카탈로그)와
    # 상태 어휘(job_state)다. 둘 다 상수뿐이라 역방향 의존도 실행 결합도 없다.
    "api_gateway.services.media.scene_split -> api_gateway.services.analysis.presets",
    "api_gateway.services.media.scene_split -> api_gateway.services.analysis.job_state",
    # 클립 길이 설정은 MI의 `maxSceneDurationSec`과 같은 값이라 같은 곳에서 읽는다.
    # 장면 분할이 값을 따로 정의하면 프로젝트가 바꾼 값이 한쪽에만 반영된다.
    "api_gateway.services.media.scene_split -> api_gateway.services.analysis.scene_options",
    # 사람이 넣거나 고치는 구간의 하한도 같은 클립 길이 설정에서 읽는다.
    "api_gateway.services.media.clip -> api_gateway.services.analysis.scene_options",
    # 작업 상세가 검수 결과를 계약 DTO로 바꿔 싣는다. 변환 함수를 work에 다시 쓰면
    # 검사 항목이 늘 때 한쪽만 바뀐다. 읽기 전용이다.
    "api_gateway.services.work.service.queries -> api_gateway.services.caption_qc",
    # 제출·승인은 검사를 기다리지 않고 커밋되고 검사는 워커가 한다. 작업 상세의 `검사 중`은
    # 워커가 대상을 고르는 조건과 같은 조건(`backlog.state_of`)으로 정한다. 읽기 전용이다.
    "api_gateway.services.work.service.queries -> api_gateway.services.caption_qc.backlog",
    # 프로젝트 생성·조회가 QC 설정을 `settings` dict에 넣고 읽는다. 설정 모양과 기본값은
    # caption_qc가 갖는다. `scene_options`와 같은 방식이다.
    "api_gateway.services.org.project -> api_gateway.services.caption_qc.settings",
    # 멤버 제거·나가기와 계정 정지가 그 사람의 보유를 푼다. 보유는 work가 소유하므로
    # 두 도메인이 `work.service.release_holds` 한 함수를 부른다. 각자 UPDATE를 쓰면
    # 한쪽만 검수 보유를 빠뜨리는 식으로 규칙이 갈린다.
    "api_gateway.services.org.project -> api_gateway.services.work.service",
    "api_gateway.services.auth.admin -> api_gateway.services.work.service",
    # media.storage는 스토리지 계약 뒤의 어댑터를 고르는 단일 진입점이다.
    # 백엔드를 바꿀 때 이 한 줄만 바뀌고, 어댑터는 도메인을 import하지 않는다.
    "api_gateway.services.media.storage -> api_gateway.services.stacks.storage_adapters.ncp",
    # 납품 패키지를 스토리지에 올리고 내려받기 주소를 낸다. `media.storage`는 스토리지의
    # 단일 관문이다.
    "api_gateway.services.exports.export_service -> api_gateway.services.media.storage",
    # 캡션 품질검수가 납품 규격 검사(`check_row`)를 그대로 쓴다. 검사를 다시 쓰면 품질검수와
    # 납품이 같은 클립에 다른 결론을 낸다. 읽기 전용이다.
    "api_gateway.services.caption_qc.runner -> api_gateway.services.exports.export_package",
    # 내보내기가 승인 검사를 기다리는 프로젝트의 시작을 미루고, 완료 목록이 `검사 중`을 싣는다.
    # 기다리는 건인지는 워커가 대상을 고르는 조건과 같아야 한다(`backlog`). 읽기 전용이다.
    "api_gateway.services.exports.export_service -> api_gateway.services.caption_qc.backlog",
    # 연동 진단은 분석 호출 분배 카운터를 읽는다. 여러 도메인을 가로질러 보는 것이 이 점검의 일이다.
    # 저장소·분석 연결은 연결 행만 센다(`models.Connection`). 버킷 왕복은 프로젝트 대상 점검이 한다.
    "api_gateway.services.ops.diagnostics -> api_gateway.services.maiu.slot_counter",
    # 연결 점검이 예외를 연동 진단과 같은 사전으로 사유 문장으로 바꾼다.
    # 사전이 둘이면 같은 실패가 개요 카드와 연결 목록에서 다르게 표시된다.
    "api_gateway.services.stacks.connections -> api_gateway.services.ops.diagnostics",
    # 캡션 검수 모델 연결의 설정 키는 caption_qc가 갖는다.
    # 연결 쪽에서 키 이름을 다시 적으면 설정 모양이 두 곳에 정의된다.
    "api_gateway.services.stacks.connections -> api_gateway.services.caption_qc.settings",
    # 연결 선택지가 품질검수에 쓸 수 있는 연결을 고를 때 저장 검사와 같은 판정(어댑터 카탈로그)을 쓴다.
    "api_gateway.services.stacks.connections -> api_gateway.services.caption_qc.adapters",
    # MI 연결 점검은 분석 요청과 같은 클라이언트와 서명으로 워크스페이스를 읽는다.
    # 점검이 서명을 따로 구현하면 점검은 통과하는데 분석만 실패하는 연결이 생긴다. 읽기 조회뿐이다.
    "api_gateway.services.stacks.connections -> api_gateway.services.maiu.naver_client",
    # 분석 연동이 꺼진 서버의 MI 연결 점검은 분석 대상 점검과 같은 결과 문장을 쓴다.
    # 문장은 가짜 클라이언트 옆(`maiu.client`)에 한 번만 둔다. 상수 읽기뿐이다.
    "api_gateway.services.stacks.connections -> api_gateway.services.maiu.client",
    # 프로젝트별 분석 대상을 고르는 규칙(`project_stack`)은 MI를 쓰는 분석 방식인지(카탈로그),
    # 분석 요청과 같은 클라이언트로 읽은 워크스페이스·MI 프로젝트 목록, 분석 자원 진단과 같은
    # 응답 해석·"없음" 판정, 클라이언트의 일시 오류 타입을 쓴다. 판정을 따로 구현하면 진단과 저장이
    # 같은 실패를 다르게 판정한다. 사유 문장은 연동 진단과 같은 사전과 `Check` 모양으로 만든다.
    # 모두 읽기 조회와 판정 재사용이다.
    "api_gateway.services.stacks.project_stack -> api_gateway.services.analysis.presets",
    "api_gateway.services.stacks.project_stack -> api_gateway.services.maiu.client",
    "api_gateway.services.stacks.project_stack -> api_gateway.services.maiu.provisioning",
    "api_gateway.services.stacks.project_stack -> api_gateway.services.maiu.naver_client",
    "api_gateway.services.stacks.project_stack -> api_gateway.services.ops.diagnostics",
    # 프로젝트별 저장소 대상을 고르는 규칙(`project_storage`)은 NCP 저장소를 쓰는 분석 방식인지
    # (카탈로그)와, 업로드·산출 경로와 같은 저장소 클라이언트로 버킷에 실제로 요청을 보내는 점검을 쓴다.
    # 점검이 클라이언트를 따로 만들면 점검은 통과하는데 업로드만 실패하는 연결이 생긴다.
    # 사유 문장은 연동 진단과 같은 사전과 `Check` 모양으로 만든다. 점검 객체만 쓰고 지운다.
    "api_gateway.services.stacks.project_storage -> api_gateway.services.analysis.presets",
    "api_gateway.services.stacks.project_storage -> api_gateway.services.media.storage",
    "api_gateway.services.stacks.project_storage -> api_gateway.services.ops.diagnostics",
    # 영상 행을 만들기 전에 스택 저장과 같은 프로젝트 행 잠금을 잡는다. 잠금 순서는 stack_lock 한 곳에 있다.
    "api_gateway.services.media.video.commands -> api_gateway.services.stacks.stack_lock",
    # 잠근 뒤 다시 읽은 설정에 기록해야 할 대상이 있는지는 게이트·화면과 같은 카탈로그 판정을 쓴다.
    "api_gateway.services.stacks.stack_lock -> api_gateway.services.analysis.presets",
]

# 커널 평면 모듈은 어느 도메인 패키지도 import하지 않는다.
# 감사·권한·알림·재시도 판정처럼 모든 도메인이 부르는 모듈이라, 도메인 하나를 import하면
# 그 도메인이 모든 도메인의 의존이 되고 순환이 생긴다.
# 다른 모듈을 거쳐 도메인 패키지에 닿는 간접 import도 막는다.
# services/ 에 평면 모듈을 새로 만들면 여기(커널)나 tests/contract/test_import_contracts.py의
# 비커널 목록 중 한 곳에 넣어야 테스트가 통과한다.
[[tool.importlinter.contracts]]
name = "커널 평면 모듈 — 도메인 패키지 import 금지"
type = "forbidden"
source_modules = [
    "api_gateway.services.audit",
    "api_gateway.services.authz",
    "api_gateway.services.caption",
    "api_gateway.services.crypto",
    "api_gateway.services.csv_cell",
    "api_gateway.services.deident_gap",
    "api_gateway.services.error_text",
    "api_gateway.services.joblock",
    "api_gateway.services.operating_time",
    "api_gateway.services.platform_credentials",
    "api_gateway.services.reject_reasons",
    "api_gateway.services.text_search",
    "api_gateway.services.transient",
    "api_gateway.services.video_meta",
]
forbidden_modules = [
    "api_gateway.services.analysis",
    "api_gateway.services.analytics",
    "api_gateway.services.auth",
    "api_gateway.services.caption_qc",
    "api_gateway.services.exports",
    "api_gateway.services.maiu",
    "api_gateway.services.media",
    "api_gateway.services.ops",
    "api_gateway.services.org",
    "api_gateway.services.stacks",
    "api_gateway.services.work",
    "api_gateway.services.workforce",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_gateway"]
