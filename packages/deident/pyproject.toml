[project]
name = "essential-deident"
version = "3.1.4"
description = "RebornStudio 영상 얼굴 비식별화 모듈 (YuNet, ByteTrack, 모자이크)"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.18",
    # ByteTrack은 0.28부터 사용 중단 예고(0.30에서 제거)라 0.28 미만으로 묶는다.
    "supervision>=0.25,<0.28",
]

[project.optional-dependencies]
# GPU 서버에서는 onnxruntime 대신 onnxruntime-gpu를 설치한다. 두 패키지를 같이 두면 충돌한다.
gpu = ["onnxruntime-gpu>=1.18"]

[dependency-groups]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/essential_deident"]
