[project]
name = "reborn-contracts"
version = "3.1.4"
description = "RebornStudio 공유 스키마 (Pydantic 단일 소스)"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic[email]>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reborn_contracts"]
