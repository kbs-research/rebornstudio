[project]
name = "reborn-transcode"
version = "3.1.4"
description = "RebornStudio FFmpeg 미디어 처리 (무DB 잡 러너)"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reborn_transcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
