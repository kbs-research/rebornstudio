[project]
name = "worker-jobs"
version = "3.1.4"
description = "RebornStudio Worker Jobs — DB 없이 도는 잡(트랜스코딩·씬 분할·publish·비식별화)"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
# api-gateway와 worker-io에 의존하지 않는다. 잡은 페이로드 하나로 일하고 결과를 큐로 회신한다.
dependencies = [
  "celery[redis]>=5.4",
  "reborn-transcode",
  "reborn-contracts",
  # 비식별화 잡(deident_one)이 이 프로세스에서 YuNet 모듈을 돌린다.
  "essential-deident",
]

[dependency-groups]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
