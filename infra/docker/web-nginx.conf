# web nginx 설정. SPA 정적 서빙과 /api 스트립 프록시를 맡는다.
#
# 규칙은 vite dev proxy(apps/web/vite.config.ts)와 같아야 한다. dev와 prod의 라우팅이
# 다르면 dev에서만 동작하는 경로가 생긴다.
# 보안 응답 헤더는 바깥에 열리는 운영 엣지에만 둔다. 개발 포트는 루프백에만 열린다.

# 업로드는 presigned POST로 스토리지에 바로 가므로 API 본문은 JSON뿐이다.
# api의 max_request_body_bytes(2MiB)보다 넉넉하게 둔다.
client_max_body_size 4m;

# 응답 헤더와 오류 화면에 nginx 버전을 싣지 않는다.
server_tokens off;

# 접근 로그에는 쿼리 문자열을 남기지 않는다. 비밀번호 재설정 토큰은 주소 조각(`#token=`)에 있지만,
# 쿼리로 토큰을 담은 링크(`?token=`)와 다른 경로의 쿼리 값이 로그를 읽는 사람에게 보이지 않게 한다.
# 요청 줄은 `$request` 대신 메서드·받은 경로의 `?` 앞·프로토콜로 쓰고, Referer도 `?` 앞까지만 남긴다.
# 같은 오리진의 Referer에는 앞 화면 주소의 쿼리가 그대로 실린다.
# `$uri`는 SPA fallback 뒤 `/index.html`로 바뀌므로 받은 주소(`$request_uri`)를 자른다.
map $request_uri $path_no_query {
    "~^(?<request_path>[^?]*)" $request_path;
    default "";
}
map $http_referer $referer_no_query {
    "~^(?<referer_base>[^?#]*)" $referer_base;
    default "";
}
log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $path_no_query $server_protocol" $status $body_bytes_sent '
                    '"$referer_no_query" "$http_user_agent"';
error_log /dev/stderr warn;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# 믿는 앞단 프록시 설정. 시작 스크립트(web-proxy-trust.sh)가 WEB_TRUSTED_PROXIES로 만든다.
# 믿는 앞단에서 온 연결이면 `set_real_ip_from`이 `$remote_addr`를 앞단이 넘긴 사용자 주소로 바꾸고,
# `$from_trusted_proxy`가 1이 된다. 값이 비면 아무도 믿지 않아 `$remote_addr`는 연결한 주소 그대로다.
include /etc/nginx/generated/proxy-trust.conf;

# api에 넘길 원래 요청의 scheme. 믿는 앞단 TLS 프록시(LB 또는 호스트 nginx)가 보낸 X-Forwarded-Proto만
# 쓰고, 그 밖에는 이 nginx가 받은 scheme(http)을 쓴다. `$scheme`만 넘기면 앞단에서 TLS를 끝내도
# api가 늘 http로 보아 로그인 쿠키에 Secure가 붙지 않고 refresh의 출처 비교가 어긋난다.
# 사용자가 직접 보낸 값은 버린다. api는 이 값을 진단 표시, 저장소 CORS 점검의 주소, 로그인 쿠키의 Secure,
# refresh·logout의 출처 비교에 쓴다. 값은 http와 https만 넘긴다.
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default        $scheme;
    "~*^1:https$"  https;
    "~*^1:http$"   http;
}

# api 업스트림. compose의 서비스 이름이다. resolver 없이 시작할 때 해석되므로
# api가 먼저 떠 있어야 한다(compose의 depends_on).
upstream api_upstream {
    server api:8000;
}

server {
    # nginx는 비 root 사용자로 80을 연다. 컨테이너 네트워크의 비특권 포트 시작값이 0이라서 열 수 있다
    # (도커 기본값이고 compose.prod.yaml의 `sysctls`가 다시 적는다). 포트를 바꾸지 않아 이전 이미지로
    # 되돌려도 compose의 포트 연결이 그대로 맞는다.
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 컨테이너 stdout으로 로그를 남긴다. server 수준에 두어야 이미지 기본
    # nginx.conf가 http 수준에 둔 `main` 형식 로그(쿼리 포함)를 상속하지 않는다.
    access_log /dev/stdout no_query;

    # add_header가 없는 location(/healthz·/api/ 등)은 이 server 수준 헤더를 상속한다.
    include /etc/nginx/generated/security-headers.conf;

    # liveness. 프로세스 생존만 본다. api 연결성은 api 자신의 /readyz가 본다.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # /api/* → api로 스트립 프록시한다(SigV4가 아닌 일반 리버스 프록시).
    location /api/ {
        proxy_pass http://api_upstream/;   # 끝 슬래시 = /api 프리픽스 제거
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # 해시 파일명 자산은 바뀌지 않으므로 1년 캐시한다(vite 산출물: assets/*-[hash].*).
    location /assets/ {
        include /etc/nginx/generated/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. 라우터 경로(/p/:slug/...)를 새로고침해도 index.html이 받는다.
    # index.html은 캐시하지 않는다. 배포 직후 구버전 셸이 새 해시 자산을 찾지 못하는 것을 막는다.
    location / {
        include /etc/nginx/generated/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
