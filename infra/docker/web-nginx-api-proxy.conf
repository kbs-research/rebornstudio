# web nginx의 api 프록시 공통 설정. web-nginx.conf의 /api 경로 location들이 include한다.
# 경로마다 따로 쓰면 한쪽에서 X-Forwarded-For가 빠져 api가 사용자 주소 대신 nginx 주소를 본다.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# X-Forwarded-For는 받은 값에 덧붙이지 않고 `$remote_addr` 하나로 덮어쓴다. 앞단 없이 80을 바로
# 여는 운영에서 덧붙이면 사용자가 보낸 값이 맨 앞에 남고, api가 그 값을 로그인 한도와 감사 기록의
# 주소로 쓸 수 있다. 앞단 LB를 두면 WEB_TRUSTED_PROXIES에 그 대역을 적는다. 그러면 `set_real_ip_from`이
# `$remote_addr`를 LB가 넘긴 사용자 주소로 바꾼다(web-proxy-trust.sh).
proxy_set_header X-Forwarded-For $remote_addr;
# 값은 web-nginx.conf의 map이 정한다. 믿는 앞단이 보낸 값만 쓰고, 그 밖에는 이 nginx가 받은 scheme이다.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# 대량 등록·집계는 수 초 걸릴 수 있어 기본 60s를 유지하고 스트리밍 버퍼링을 끈다.
proxy_buffering off;
